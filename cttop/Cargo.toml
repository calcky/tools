[package]
name = "cttop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
lto = true
strip = true
