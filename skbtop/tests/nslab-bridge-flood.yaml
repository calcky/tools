version: 1
name: skbtop-flood

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.2/24]
    sw1:
      kind: bridge
      bridge:
        name: br0
        stp: false
        vlan_filtering: false
        ports:
          swp1:
            learning: false
          swp2:
            learning: false
          swp3:
            learning: false
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.3/24]
    h3:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.4/24]
  links:
    - endpoints: [h1:eth0, sw1:swp1]
      mtu: 1500
    - endpoints: [h2:eth0, sw1:swp2]
      mtu: 1500
    - endpoints: [h3:eth0, sw1:swp3]
      mtu: 1500
