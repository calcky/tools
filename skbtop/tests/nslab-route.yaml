version: 1
name: skbtop-route

topology:
  nodes:
    h1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.2/24, "2001:db8:1::2/64"]
      routes:
        - dst: 198.51.100.0/24
          via: 192.0.2.1
          dev: eth0
        - dst: "2001:db8:2::/64"
          via: "2001:db8:1::1"
          dev: eth0
    r1:
      kind: linux
      interfaces:
        eth0:
          addresses: [192.0.2.1/24, "2001:db8:1::1/64"]
        eth1:
          addresses: [198.51.100.1/24, "2001:db8:2::1/64"]
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.forwarding: 1
    h2:
      kind: linux
      interfaces:
        eth0:
          addresses: [198.51.100.2/24, "2001:db8:2::2/64"]
      routes:
        - dst: 192.0.2.0/24
          via: 198.51.100.1
          dev: eth0
        - dst: "2001:db8:1::/64"
          via: "2001:db8:2::1"
          dev: eth0
  links:
    - endpoints: [h1:eth0, r1:eth0]
      mtu: 1500
    - endpoints: [r1:eth1, h2:eth0]
      mtu: 1500
