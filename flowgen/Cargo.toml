[package]
name = "flowgen"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
mio = { version = "1", features = ["os-poll", "os-ext"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
hdrhistogram = { version = "7", default-features = false }

[profile.release]
lto = true
strip = true
