[package]
name = "netlens"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A Linux network stack monitor"
license = "Apache-2.0 OR MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.5.54", features = ["derive"] }
clap_complete = "=4.5.65"
crossterm = "=0.28.1"
humantime = "2.3"
ipnet = "2.11"
instability = "=0.3.1"
libc = "0.2"
ratatui = "=0.29.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "=0.3.18"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
# Keep jsonschema's transitive graph compatible with the crate's Rust 1.82 MSRV.
idna_adapter = "=1.1.0"
jsonschema = { version = "=0.26.2", default-features = false }
tempfile = "~3.20.0"
uuid = "=1.20.0"

[profile.release]
lto = "thin"
strip = true
