site_name: Linux tools
site_description: Linux 调试、监控与测试工具
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/calcky/tools
repo_name: calcky/tools
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
strict: true
hooks:
  - docs/hooks.py

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换深色模式
    - scheme: slate
      primary: teal
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换浅色模式
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: Linux debugging, monitoring and testing tools
          theme:
            palette:
              - scheme: default
                primary: teal
                accent: blue
                toggle:
                  icon: material/brightness-4
                  name: Switch to dark mode
              - scheme: slate
                primary: teal
                accent: blue
                toggle:
                  icon: material/brightness-7
                  name: Switch to light mode
          nav_translations:
            概览: Overview
            快速开始: Quick Start
            安装与使用: Installation
            工具: Tools
            快速上手: Getting Started
            连接与进程: Connections And Processes
            网卡、队列与中断: Interfaces, Queues And IRQs
            路由与连接跟踪: Routing And Conntrack
            指标与数据状态: Metrics And Data Status
            数据包路径: Packet Paths
  - search:
      lang: [en, zh]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

exclude_docs: |
  requirements.txt
  generate.py
  hooks.py
  development.md
  documentation.md
  tests/**
  superpowers/**
  performance/**

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - 概览: index.md
  - 快速开始:
      - 安装与使用: getting-started.md
  - 工具:
      - irqtop / irqstat: irqtop/README.md
      - netping: netping/README.md
      - flowgen: flowgen/README.md
      - cttop: cttop/README.md
      - netlens:
          - 快速上手: netlens/README.md
          - 连接与进程: netlens/docs/cli.md
          - 网卡、队列与中断: netlens/docs/interfaces.md
          - 路由与连接跟踪: netlens/docs/routing.md
          - 指标与数据状态: netlens/docs/monitor-metrics.md
          - 数据包路径: netlens/docs/packet-path.md
      - bpftrace: bpftrace/README.md
      - bpftop: bpftop/README.md
      - nettrace: nettrace/README.md
      - netcap: netcap/README.md
      - xpcap: xpcap/README.md
      - xsktop: xsktop/README.md
      - droptop: droptop/README.md
      - gomemtop: gomemtop/README.md
      - fdtop: fdtop/README.md
      - cachetop: cachetop/README.md
