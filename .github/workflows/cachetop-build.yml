name: Build cachetop

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["cachetop/**", "Makefile", ".github/workflows/cachetop-build.yml"]
    tags: ["cachetop-release"]
  pull_request:
    paths: ["cachetop/**", "Makefile", ".github/workflows/cachetop-build.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Check
        working-directory: cachetop
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            target: armv7-unknown-linux-musleabihf
            machine: ARM
            qemu: arm
          - arch: arm64
            target: aarch64-unknown-linux-musl
            machine: AArch64
            qemu: aarch64
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            machine: X86-64
            qemu: none
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross 0.2.5
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz \
            --output cross.tar.gz
          echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross.tar.gz' | sha256sum --check
          mkdir -p cross-bin
          tar -xzf cross.tar.gz -C cross-bin
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'x86_64'
      - name: Build static executable
        working-directory: cachetop
        run: cross build --release --locked --target '${{ matrix.target }}'
      - name: Check ELF and startup
        run: |
          binary='cachetop/target/${{ matrix.target }}/release/cachetop'
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cachetop/Cargo.toml | head -1)
          readelf -h "$binary" | grep -q 'Machine:.*${{ matrix.machine }}'
          if readelf -lW "$binary" | grep -q INTERP; then exit 1; fi
          if readelf -dW "$binary" 2>&1 | grep -q NEEDED; then exit 1; fi
          if [[ '${{ matrix.arch }}' == x86_64 ]]; then
            actual=$("$binary" --version)
          else
            actual=$(docker run --rm -v "$PWD/$binary:/app/cachetop:ro" \
              'ghcr.io/cross-rs/${{ matrix.target }}:0.2.5' \
              '/usr/bin/qemu-${{ matrix.qemu }}-static' /app/cachetop --version)
          fi
          test "$actual" = "cachetop $version"
          install -D -m 755 "$binary" 'dist/cachetop-linux-${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cachetop-linux-${{ matrix.arch }}
          path: dist/cachetop-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/tags/cachetop-release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cachetop-linux-*
          merge-multiple: true
          path: dist
      - name: Publish static binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: cachetop-release
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' cachetop/Cargo.toml | head -1)
          test -n "$version"
          for arch in arm arm64 x86_64; do test -s "dist/cachetop-linux-$arch"; done
          assets=(dist/cachetop-linux-arm dist/cachetop-linux-arm64 dist/cachetop-linux-x86_64)
          (cd dist && sha256sum cachetop-linux-arm cachetop-linux-arm64 cachetop-linux-x86_64 > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          assets+=(dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "cachetop v$version" --notes-file cachetop/RELEASE.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "cachetop v$version" --notes-file cachetop/RELEASE.md
          fi
          for name in cachetop-linux-arm cachetop-linux-arm64 cachetop-linux-x86_64 SHA256SUMS; do
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
