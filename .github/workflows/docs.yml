name: Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
      - "*/README.md"
      - "*/RELEASE.md"
      - "netlens/docs/**"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
      - "*/README.md"
      - "*/RELEASE.md"
      - "netlens/docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - run: python3 docs/tests/test_site.py
      - name: Check version-prefixed hosting
        run: |
          READTHEDOCS_CANONICAL_URL=https://docs.example.org/en/latest/ \
            mkdocs build --strict --site-dir "$RUNNER_TEMP/docs-prefix"
          DOCS_SITE_DIR="$RUNNER_TEMP/docs-prefix" python3 docs/tests/test_site.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tools-documentation
          path: site/
          if-no-files-found: error
          retention-days: 14
