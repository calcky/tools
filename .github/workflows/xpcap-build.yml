name: Build xpcap

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["xpcap/**", "Makefile", ".github/workflows/xpcap-build.yml"]
    tags: ["xpcap-release"]
  pull_request:
    paths: ["xpcap/**", "Makefile", ".github/workflows/xpcap-build.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libbpf-dev libelf-dev zlib1g-dev libzstd-dev pkg-config
      - name: Check
        working-directory: xpcap
        env:
          LIBBPF_SYS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            target: armv7-unknown-linux-musleabihf
            machine: ARM
          - arch: arm64
            target: aarch64-unknown-linux-musl
            machine: AArch64
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            machine: X86-64
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C target-feature=+crt-static"
      XPCAP_BPF_OBJECT: bpf/capture.bpf.o
      LIBBPF_SYS_LIBRARY_PATH: /opt/xpcap/lib
      LIBBPF_SYS_EXTRA_CFLAGS: "-I/opt/xpcap/include"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Install BPF compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
      - name: Compile portable BPF object
        working-directory: xpcap
        run: |
          clang -target bpf -O2 -g -Wall -Werror \
            -I/usr/include/$(cc -dumpmachine) \
            -c bpf/capture.bpf.c -o bpf/capture.bpf.o
      - name: Install cross 0.2.5
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz \
            --output cross.tar.gz
          echo 'a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588  cross.tar.gz' | sha256sum --check
          mkdir -p cross-bin
          tar -xzf cross.tar.gz -C cross-bin
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'x86_64'
      - name: Build static executable
        working-directory: xpcap
        run: cross build --release --locked --target '${{ matrix.target }}'
      - name: Verify architecture and static linkage
        run: |
          binary='xpcap/target/${{ matrix.target }}/release/xpcap'
          readelf -h "$binary" | grep -q 'Machine:.*${{ matrix.machine }}'
          if readelf -lW "$binary" | grep -q INTERP; then exit 1; fi
          if readelf -dW "$binary" 2>&1 | grep -q NEEDED; then exit 1; fi
          test -s "$binary"
          install -D -m 755 "$binary" 'dist/xpcap-linux-${{ matrix.arch }}'
      - name: Startup smoke test
        working-directory: xpcap
        run: |
          cross run --release --locked --target '${{ matrix.target }}' -- -h
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$(cross run --release --locked --target '${{ matrix.target }}' -- -V)" = "xpcap $version"
      - uses: actions/upload-artifact@v4
        with:
          name: xpcap-linux-${{ matrix.arch }}
          path: dist/xpcap-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/tags/xpcap-release'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xpcap-linux-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          for arch in arm arm64 x86_64; do
            test -s "dist/xpcap-linux-$arch"
            (cd dist && sha256sum "xpcap-linux-$arch" > "xpcap-linux-$arch.sha256")
          done
      - name: Publish executables
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("xpcap/Cargo.toml", "rb"))["package"]["version"])')
          assets=(dist/xpcap-linux-{arm,arm64,x86_64} dist/xpcap-linux-{arm,arm64,x86_64}.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false \
              --title "xpcap v${version}" --notes-file xpcap/RELEASE.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag \
              --title "xpcap v${version}" --notes-file xpcap/RELEASE.md
            gh release edit "$RELEASE_TAG" --draft=false
          fi
